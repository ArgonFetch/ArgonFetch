<nav class="navbar">
  <div class="nav-content">
    <div class="nav-left">
      <a routerLink="/" class="nav-logo">ArgonFetch</a>
    </div>
    <div class="nav-right">
      <button class="theme-toggle" (click)="toggleTheme()">
        <fa-icon [icon]="(isDarkTheme$ | async) ? faSun : faMoon"></fa-icon>
      </button>
    </div>
  </div>
</nav>

@if (maintenance) {
  <div class="maintenance" role="status" aria-live="polite">
    <div class="maintenance-card">
      <fa-icon [icon]="faGear" class="maintenance-icon" animation="spin"></fa-icon>
      <h1 class="maintenance-title">{{ maintenance }}</h1>
      <p class="maintenance-message">
        ArgonFetch is updating itself and will be back in a moment. This page returns on its own.
      </p>
    </div>
  </div>
}

<router-outlet></router-outlet>

<footer class="footer">
  <div class="footer-links">
    <a href="https://www.argonfetch.dev" class="footer-link">ArgonFetch</a>
    <span class="footer-separator">•</span>
    <a href="https://github.com/ArgonFetch/ArgonFetch" class="footer-link" target="_blank">
      GitHub <fa-icon [icon]="faGithub" class="footer-github-icon"></fa-icon>
    </a>
    <span class="footer-separator">•</span>
    <span class="footer-environment">{{ environment }}</span>
    <span class="footer-separator">•</span>
    <a href="https://github.com/ArgonFetch/ArgonFetch/releases/tag/{{ version }}" class="footer-link footer-version" target="_blank">{{ version }}</a>
  </div>
</footer>
