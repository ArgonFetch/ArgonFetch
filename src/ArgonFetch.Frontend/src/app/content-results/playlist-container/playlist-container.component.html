<div class="playlist-container">
  <div class="playlist-header">
    <div class="playlist-content">
      <div class="playlist-thumbnail">
        <img [src]="resourceInformation.coverUrl" alt="Playlist Cover">
      </div>

      <div class="playlist-info">
        <div class="title-row">
          <h3 class="playlist-title">{{ resourceInformation.title }}</h3>
        </div>
        <p class="playlist-author">By {{ resourceInformation.author }}</p>

        <app-download-progress />

      </div>

      @if (archiveUrl(); as archive) {
        <!-- A plain link, not a fetch: the browser's own download manager takes it, so the
             archive keeps arriving after this page is navigated away from or closed, and
             none of it is held in the tab's memory. -->
        <a class="action-button archive-button" [href]="archive" download
          (click)="onArchiveRequested()"
          [attr.aria-label]="'Download all of ' + resourceInformation.title + ' as a zip'"
          [title]="archiveHint()">
          <app-icon [name]="archiveIcon" [size]="18" />
        </a>
      }
    </div>
  </div>

  <div class="songs-list">
    <ul>
      @for (song of resourceInformation.mediaItems; track song.requestedUrl) {
        <li class="song-item">
          <img [src]="song.coverUrl" alt="Song Cover" class="song-cover">
          <div class="song-info">
            <p class="song-name">{{ song.title }}</p>
            <p class="song-author">{{ song.author }}</p>
          </div>
          <button type="button" class="action-button download-button"
            [disabled]="isDownloading() || isBusy(song)"
            (click)="onDownloadSong(song)"
            [attr.aria-label]="'Download ' + song.title">
            @if (isBusy(song)) {
              <app-icon [name]="spinnerIcon" [size]="18" class="spinning" />
            } @else {
              <app-icon [name]="downloadIcon" [size]="18" />
            }
          </button>
        </li>
      }
    </ul>
  </div>
</div>
